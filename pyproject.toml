[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-demand"
version = "0.1.0"
description = "State-space estimation of market cycle dynamics in spiral coordinates, with an econometric rent-growth forecasting toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "paintbrush"}
]
keywords = [
    "market-cycles",
    "state-space",
    "kalman-filter",
    "econometrics",
    "real-estate",
    "multifamily",
    "rent-forecasting",
    "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "streamlit>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "numpy-financial>=1.0",
    "optuna>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/paintbrushv/plat-supply-demand"
Repository = "https://github.com/paintbrushv/plat-supply-demand"
Issues = "https://github.com/paintbrushv/plat-supply-demand/issues"
Changelog = "https://github.com/paintbrushv/plat-supply-demand/blob/main/README.md"

[project.scripts]
econ = "econometrics.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.0.280",
    "mypy>=1.4",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

bayesian = [
    # Reserved for future Bayesian estimation (not yet implemented)
    "pymc>=5.6",
    "arviz>=0.15",
]

econometrics = [
    "pyarrow>=14.0",
    "libpysal>=4.9",
    "spreg>=1.4",
    "lightgbm>=4.0",
    "optuna>=3.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["supply_demand*", "econometrics*"]

[tool.setuptools.package-data]
supply_demand = ["config/*.yaml"]
econometrics = ["config/metros/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-v --tb=short"
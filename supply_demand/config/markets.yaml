# Market Definitions Configuration
# Each market defines geography, data source mappings, and model parameters

markets:
  dallas_multifamily:
    name: "Dallas-Fort Worth Multifamily"
    geography:
      msa_code: "19100"
      cbsa_code: "19100"
      state: "TX"
      counties:
        - fips: "48113"
          name: "Dallas"
        - fips: "48439"
          name: "Tarrant"
        - fips: "48085"
          name: "Collin"
        - fips: "48121"
          name: "Denton"

    asset_class: "multifamily"
    subtype: "all"  # garden, mid-rise, high-rise, or all

    data_sources:
      costar:
        market_id: "dallas_tx"
        submarket_ids:
          - "uptown"
          - "oak_lawn"
          - "design_district"
          - "deep_ellum"
          - "downtown"
      bls:
        employment_series: "SMU48192000000000001"
      census:
        county_fips:
          - "48113"
          - "48439"
          - "48085"
          - "48121"

    model_parameters:
      # Demand equation parameters
      alpha_1: 0.3   # Income sensitivity
      alpha_2: 0.2   # Price sensitivity
      alpha_3: 0.15  # Capital flow sensitivity
      tau_1: 2       # Capital -> Demand lag (months)

      # Supply equation parameters
      beta_1: 0.25   # Price sensitivity
      beta_2: 0.2    # Capital flow sensitivity
      beta_3: 0.1    # Supply adjustment speed
      tau_2: 18      # Price -> Supply lag (months)
      tau_3: 12      # Capital -> Supply lag (months)

      # Capital flow equation parameters
      gamma_1: 0.3   # Return gap sensitivity
      gamma_2: 0.15  # Price acceleration sensitivity
      gamma_3: 0.2   # Imbalance sensitivity

      # Price formation
      lambda_: 0.1   # Price adjustment speed

      # Noise parameters
      sigma_D: 0.05  # Demand process noise
      sigma_S: 0.03  # Supply process noise
      sigma_K: 0.08  # Capital flow process noise

    equilibrium:
      method: "replacement_cost"
      cap_rate_spread_over_10yr: 0.025
      construction_cost_growth: 0.03


# Austin Multifamily — Metro Configuration

metro_id: austin_tx
display_name: "Austin Multifamily"
msa_code: "12420"
state_fips: "48"
counties: ["453", "491", "209"]  # Travis, Williamson, Hays

# CoStar data
costar_panel_path: "data/paid/costar-submarket/"
costar_market_key: "austin_multifamily"

# Submarkets
submarkets:
  - id: east_riverside
    name: "East Riverside-Oltorf"
    lat: 30.240
    lon: -97.725
    star_rating: "All"
  - id: south_austin
    name: "Bluff Springs / South Austin"
    lat: 30.195
    lon: -97.764
    star_rating: "1 & 2 Star"
  - id: north_austin
    name: "North Austin / Domain"
    lat: 30.400
    lon: -97.720
    star_rating: "All"
  - id: round_rock
    name: "Round Rock / Georgetown"
    lat: 30.510
    lon: -97.680
    star_rating: "All"
  - id: downtown
    name: "Downtown / South Congress"
    lat: 30.265
    lon: -97.745
    star_rating: "4 & 5 Star"
  - id: cedar_park
    name: "Cedar Park / Leander"
    lat: 30.520
    lon: -97.820
    star_rating: "All"

# Model specification
endogenous_vars:
  - rent_growth_yoy
  - vacancy_rate
  - deliveries_pct_inventory
  - absorption_pct_inventory

exogenous_vars:
  - mortgage_rate_30y
  - unemployment_rate
  - net_migration_returns
  - income_delta_pct
  - permit_pipeline
  - concession_spread

# FRED series IDs
fred_series:
  mortgage_rate: "MORTGAGE30US"
  treasury_10y: "DGS10"
  fed_funds: "FEDFUNDS"
  baa_spread: "BAA10Y"
  term_spread: "T10Y2Y"

# BLS
bls_msa_code: "012420"

# Permit model
permit_lag_months: 16        # Austin builds faster than DFW
permit_cbsa: "12420"

# Migration
migration_counties: ["453", "491"]  # Travis + Williamson
migration_interpolation: linear

# Spatial model
spatial_contiguity: inverse_distance

# Seasonality
decompose_seasonal: true

# Ensemble
enabled_models:
  - VAREngine
  - ECMEngine
  - RidgeLassoEngine
  - GBMEngine

ensemble_decay: 0.9
min_backtest_quarters: 4

# Forecast defaults
default_horizon_quarters: 8

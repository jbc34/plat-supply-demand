# Dallas-Fort Worth Multifamily — Metro Configuration
# Used by: econ forecast --metro dallas_tx

metro_id: dallas_tx
display_name: "Dallas-Fort Worth Multifamily"
msa_code: "19100"
state_fips: "48"
counties: ["085", "113", "121", "439"]  # Collin, Dallas, Denton, Tarrant

# CoStar data
costar_panel_path: "data/paid/costar-submarket/"
costar_market_key: "dallas_multifamily"

# Submarkets
submarkets:
  - id: far_north_dallas
    name: "Far North Dallas"
    lat: 32.988
    lon: -96.770
    star_rating: "1 & 2 Star"
  - id: addison_galleria
    name: "Addison/Galleria"
    lat: 32.954
    lon: -96.837
    star_rating: "All"
  - id: richardson_utd
    name: "Richardson/UTD"
    lat: 32.950
    lon: -96.730
    star_rating: "All"
  - id: plano
    name: "Plano"
    lat: 33.020
    lon: -96.699
    star_rating: "All"
  - id: uptown_turtle_creek
    name: "Uptown/Turtle Creek"
    lat: 32.800
    lon: -96.802
    star_rating: "All"
  - id: las_colinas
    name: "Las Colinas/Valley Ranch"
    lat: 32.878
    lon: -96.942
    star_rating: "All"

# Model specification
endogenous_vars:
  - rent_growth_yoy
  - vacancy_rate
  - deliveries_pct_inventory
  - absorption_pct_inventory

exogenous_vars:
  - mortgage_rate_30y
  - unemployment_rate
  - net_migration_returns
  - income_delta_pct
  - permit_pipeline
  - concession_spread

# FRED series IDs
fred_series:
  mortgage_rate: "MORTGAGE30US"
  treasury_10y: "DGS10"
  fed_funds: "FEDFUNDS"
  baa_spread: "BAA10Y"
  term_spread: "T10Y2Y"
  permits: "DALL148BPPRIVSA"       # Total private building permits, Dallas MSA

# BLS
bls_msa_code: "019100"

# Permit model
permit_lag_months: 18
permit_cbsa: "19100"

# Migration
migration_counties: ["085", "113"]  # Collin + Dallas
migration_interpolation: linear

# Spatial model
spatial_contiguity: inverse_distance

# Seasonality
decompose_seasonal: true

# Ensemble
enabled_models:
  - VAREngine
  - ECMEngine
  - RidgeLassoEngine
  - GBMEngine

ensemble_decay: 0.9
min_backtest_quarters: 4

# Forecast defaults
default_horizon_quarters: 8
